<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>yorick-yang · 山间手记</title><style>#newArticle,#editAbout,#editor,#articleEditor,.about>.hint{display:none!important}</style><style>
:root{color-scheme:light dark;--bg:#f8f7f1;--fg:#243d30;--muted:#61705e;--line:#b9c5b3;--card:#edf1e8;--accent:#a95135}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.75 system-ui,"Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}a{color:inherit}header,main,footer{width:min(1100px,90%);margin:auto}header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:16px 0;border-bottom:1px solid var(--line)}.brand{font:bold 27px Georgia,serif;text-decoration:none;margin-right:auto}.brand em{color:var(--accent)}nav{display:flex;gap:16px;flex-wrap:wrap}nav button,.filters button{border:0;background:none;padding:7px 4px}.active{box-shadow:inset 0 -2px var(--accent)}.hero{padding:55px 0 46px;border-bottom:1px solid var(--line)}.eyebrow,.date{font:13px/1.6 ui-monospace,monospace;color:var(--muted);letter-spacing:.08em}h1{font:600 clamp(44px,7vw,78px)/1.15 "Songti SC",SimSun,serif;margin:16px 0}h2{font:600 30px "Songti SC",SimSun,serif}.hero p{max-width:600px;color:var(--muted)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:28px 0 16px}.filters{display:flex;gap:12px;flex-wrap:wrap}.primary{border:0;border-radius:5px;padding:9px 16px;background:var(--fg);color:var(--bg)}.list{display:grid;gap:12px}.entry{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:18px}.entry summary{cursor:pointer;list-style:none}.entry summary::-webkit-details-marker{display:none}.entry h3{font:600 23px "Songti SC",SimSun,serif;margin:6px 0}.tag{color:var(--accent)}.body{white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid var(--line);padding-top:15px;margin-top:15px}.about{border-top:1px solid var(--line);margin-top:55px;padding:12px 0 35px}.about-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,300px);gap:28px;align-items:start}.about-text{white-space:pre-wrap;overflow-wrap:anywhere}.about img{width:100%;border-radius:7px;object-fit:cover}.hint{color:var(--muted);font-size:14px}dialog{width:min(620px,94vw);max-height:90vh;overflow:auto;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:24px}dialog::backdrop{background:#17251bb0}dialog label{display:block;margin:12px 0}dialog input,dialog textarea,dialog select{display:block;width:100%;padding:9px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:5px}textarea{min-height:150px}.actions{display:flex;gap:10px;flex-wrap:wrap}footer{border-top:1px solid var(--line);padding:20px 0;margin-top:30px;color:var(--muted);font-size:14px}[hidden]{display:none!important}@media(prefers-color-scheme:dark){:root{--bg:#15241b;--fg:#e6ede2;--muted:#b1c1ad;--line:#536756;--card:#22372a;--accent:#e5a582}.primary{background:#dce9d9;color:#1b3022}}@media(max-width:650px){.about-grid{grid-template-columns:1fr}header{align-items:flex-start}.hero{padding:35px 0}}
</style></head><body><header><a class="brand" href="#首页">yorick-yang<em>.</em></a><nav aria-label="主导航"><button data-filter="全部">首页</button><button data-filter="资料">资料</button><button data-filter="博客">博客</button><button data-filter="杂感">杂感</button><button id="aboutLink">关于我</button></nav></header><main><section class="hero"><div class="eyebrow">YORICK-YANG / FIELD NOTES</div><h1>山间手记</h1><p>把值得留下的资料、长文和片刻想法，收进这一册。</p></section><section><div class="toolbar"><h2>文章与笔记</h2><div class="filters" aria-label="分类筛选"><button data-filter="全部">全部</button><button data-filter="资料">资料</button><button data-filter="博客">博客</button><button data-filter="杂感">杂感</button></div><button class="primary" id="newArticle">写新内容</button></div><div class="list" id="list"></div><p class="hint" id="empty" hidden>这个分类还没有内容。</p></section><section class="about" id="about"><div class="toolbar"><h2>关于我</h2><button class="primary" id="editAbout">编辑关于我 / 插入图片</button></div><div class="about-grid"><p class="about-text" id="aboutText"></p><img id="aboutImage" alt="关于我的图片" hidden></div><p class="hint">编辑会先保存在这台设备。点击“下载更新后的网页”，再把文件上传到托管平台，访客才能看到更新。</p></section></main><footer>yorick-yang · 山间手记</footer><dialog id="editor"><h2>编辑关于我</h2><label>介绍文字<textarea id="aboutInput" maxlength="20000"></textarea></label><label>插入图片（建议小于 1 MB）<input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label><div class="actions"><button class="primary" id="saveAbout">保存到本机</button><button id="exportPage">下载更新后的网页</button><button id="closeEditor">关闭</button></div><p class="hint" id="editStatus"></p></dialog><dialog id="articleEditor"><h2>写新内容</h2><label>分类<select id="articleKind"><option>博客</option><option>杂感</option><option>资料</option></select></label><label>标题<input id="articleTitle" maxlength="100"></label><label>正文<textarea id="articleBody" maxlength="120000"></textarea></label><label>从文本文件导入（可选）<input id="articleFile" type="file" accept=".txt,.md,text/plain,text/markdown"></label><div class="actions"><button class="primary" id="saveArticle">保存到本机</button><button id="closeArticle">关闭</button></div><p class="hint">保存后使用“关于我”里的下载按钮导出网页并重新上传，访客才会看到。</p></dialog><script id="site-data" type="application/json">{"about":"你好，我是 Yorick Yang。这里是我存放文章、资料和日常杂感的地方。欢迎慢慢读。","image":"","posts":[{"kind":"杂感","title":"开卷：关于山间手记","date":"2026-11-24","body":"这里给三种不同的记录留了位置。资料、博客和杂感，慢慢积累成自己的档案。"}]}</script><script>
const $=s=>document.querySelector(s),initial=JSON.parse($('#site-data').textContent);let data;try{data=JSON.parse(localStorage.getItem('yorick-yang-static')||'null')||initial}catch{data=initial}let filter='全部';function persist(){try{localStorage.setItem('yorick-yang-static',JSON.stringify(data));return true}catch{return false}}function render(){let items=(data.posts||[]).filter(x=>filter==='全部'||x.kind===filter);$('#list').replaceChildren();$('#empty').hidden=!!items.length;for(const item of items){let d=document.createElement('details');d.className='entry';let s=document.createElement('summary'),tag=document.createElement('span'),h=document.createElement('h3'),date=document.createElement('span'),body=document.createElement('div');tag.className='tag';tag.textContent=item.kind;h.textContent=item.title;date.className='date';date.textContent=item.date||'';body.className='body';body.textContent=item.body||'';s.append(tag,h,date);d.append(s,body);$('#list').append(d)}$('#aboutText').textContent=data.about||'';$('#aboutImage').hidden=!data.image;if(data.image)$('#aboutImage').src=data.image;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter))}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render();document.querySelector('.toolbar').scrollIntoView({behavior:'smooth'})});$('#aboutLink').onclick=()=>$('#about').scrollIntoView({behavior:'smooth'});$('#newArticle').onclick=()=>$('#articleEditor').showModal();$('#closeArticle').onclick=()=>$('#articleEditor').close();$('#articleFile').onchange=async()=>{let f=$('#articleFile').files[0];if(f){$('#articleBody').value=await f.text();if(!$('#articleTitle').value)$('#articleTitle').value=f.name.replace(/\.[^.]+$/,'')}};$('#saveArticle').onclick=()=>{let title=$('#articleTitle').value.trim(),body=$('#articleBody').value.trim();if(!title||!body){alert('请填写标题和正文。');return}data.posts.unshift({kind:$('#articleKind').value,title,body,date:new Date().toISOString().slice(0,10)});persist();render();$('#articleEditor').close();$('#articleTitle').value='';$('#articleBody').value=''};$('#editAbout').onclick=()=>{$('#aboutInput').value=data.about||'';$('#editStatus').textContent='';$('#editor').showModal()};$('#closeEditor').onclick=()=>$('#editor').close();async function save(){data.about=$('#aboutInput').value;let file=$('#imageInput').files[0];if(file){if(file.size>1500000){$('#editStatus').textContent='图片请压缩到 1.5 MB 以内。';return false}data.image=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}if(!persist())$('#editStatus').textContent='本机存储空间不足，请直接下载网页。';render();return true}$('#saveAbout').onclick=async()=>{if(await save())$('#editStatus').textContent='已保存到本机。要让访客看到，请下载并上传更新后的网页。'};$('#exportPage').onclick=async()=>{if(!await save())return;let doc=document.documentElement.cloneNode(true);doc.querySelector('#site-data').textContent=JSON.stringify(data).replace(/</g,'\\u003c');doc.querySelector('#aboutImage').removeAttribute('src');doc.querySelector('#aboutImage').hidden=true;let blob=new Blob(['<!doctype html>\n'+doc.outerHTML],{type:'text/html;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000);$('#editStatus').textContent='index.html 已下载；将它上传覆盖旧文件即可公开更新。'};render();
</script></body></html>
