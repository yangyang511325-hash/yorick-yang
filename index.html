<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8f7f1">
  <title>yorick-yang · 山间手记</title>
  <style>
    :root{color-scheme:light dark;--bg:#f8f7f1;--fg:#243d30;--muted:#61705e;--line:#b9c5b3;--card:#edf1e8;--accent:#a95135;--btn:#294735}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.75 system-ui,"Microsoft YaHei",sans-serif}
    button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    header,main,footer{width:min(1100px,90%);margin:auto}header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:16px 0;border-bottom:1px solid var(--line)}.brand{font:bold 27px Georgia,serif;text-decoration:none;margin-right:auto}.brand em{color:var(--accent)}nav{display:flex;gap:16px;flex-wrap:wrap}nav a{text-decoration:none;padding:7px 4px}.active{box-shadow:inset 0 -2px var(--accent)}
    .hero{padding:55px 0 46px;border-bottom:1px solid var(--line)}.eyebrow,.date{font:13px/1.6 ui-monospace,monospace;color:var(--muted);letter-spacing:.08em}h1{font:600 clamp(44px,7vw,78px)/1.15 "Songti SC",SimSun,serif;margin:16px 0}h2{font:600 30px "Songti SC",SimSun,serif}.hero p{max-width:600px;color:var(--muted)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:28px 0 16px}.filters{display:flex;gap:12px;flex-wrap:wrap}.filters button{border:0;background:none;padding:7px 4px}.primary{border:0;border-radius:5px;padding:9px 16px;background:var(--btn);color:#fff}.secondary{border:1px solid var(--line);border-radius:5px;padding:8px 14px;background:transparent}.list{display:grid;gap:12px}.entry{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:18px}.entry summary{cursor:pointer;list-style:none}.entry summary::-webkit-details-marker{display:none}.entry h3{font:600 23px "Songti SC",SimSun,serif;margin:6px 0}.tag{color:var(--accent)}.body{white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid var(--line);padding-top:15px;margin-top:15px}.entry-actions{margin-top:14px}
    #aboutPage{padding:20px 0 55px}.about-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,300px);gap:28px;align-items:start}.about-text{white-space:pre-wrap;overflow-wrap:anywhere}.about-grid img{width:100%;border-radius:7px;object-fit:cover}.hint,.status{color:var(--muted);font-size:14px}.status[role=alert]{color:var(--accent)}dialog{width:min(620px,94vw);max-height:90vh;overflow:auto;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:24px}dialog::backdrop{background:#17251bb0}dialog label{display:block;margin:12px 0}dialog input,dialog textarea,dialog select{display:block;width:100%;padding:9px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:5px}textarea{min-height:150px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}footer{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-top:1px solid var(--line);padding:20px 0;margin-top:48px;color:var(--muted);font-size:14px}footer button{border:0;background:none;text-decoration:underline;padding:0;font-size:inherit}[hidden]{display:none!important}
    @media(prefers-color-scheme:dark){:root{--bg:#15241b;--fg:#e6ede2;--muted:#b1c1ad;--line:#536756;--card:#22372a;--accent:#e5a582;--btn:#dce9d9}.primary{color:#1b3022}}
    @media(max-width:650px){.about-grid{grid-template-columns:1fr}header{align-items:flex-start}.hero{padding:35px 0}}
  </style>
</head>
<body>
  <header><a class="brand" href="#首页">yorick-yang<em>.</em></a><nav aria-label="主导航"><a href="#首页" id="homeNav">首页</a><a href="#资料" data-nav="资料">资料</a><a href="#博客" data-nav="博客">博客</a><a href="#杂感" data-nav="杂感">杂感</a><a href="#关于我" id="aboutNav">关于我</a></nav></header>
  <main>
    <div id="homePage"><section class="hero"><div class="eyebrow">YORICK-YANG / FIELD NOTES</div><h1>山间手记</h1><p>把值得留下的资料、长文和片刻想法，收进这一册。</p></section><section><div class="toolbar"><h2 id="listHeading">文章与笔记</h2><div class="filters" aria-label="分类筛选"><button data-filter="全部">全部</button><button data-filter="资料">资料</button><button data-filter="博客">博客</button><button data-filter="杂感">杂感</button></div><button class="primary" id="newArticle" hidden>写新内容</button></div><div class="list" id="list"></div><p class="hint" id="empty" hidden>这个分类还没有内容。</p></section></div>
    <section id="aboutPage" hidden><div class="toolbar"><h1>关于我</h1><button class="primary" id="editAbout" hidden>编辑文字与图片</button></div><div class="about-grid"><p class="about-text" id="aboutText"></p><img id="aboutImage" alt="关于我的图片" hidden></div></section>
  </main>
  <footer><span>yorick-yang · 山间手记</span><button id="loginOpen">站主登录</button><button id="logout" hidden>退出站主模式</button></footer>
  <dialog id="loginDialog"><h2>站主登录</h2><p class="hint">使用有该仓库写入权限的 GitHub 精细权限访问令牌。令牌只保存在当前页面内存，关闭或刷新页面即清除。</p><form id="loginForm"><label>GitHub 仓库地址<input name="repo" type="url" placeholder="https://github.com/用户名/仓库名" required></label><label>发布分支<input name="branch" value="main" required></label><label>内容文件在仓库中的路径<input name="path" value="content.json" required></label><label>GitHub 访问令牌<input name="token" type="password" autocomplete="off" required></label><p class="status" id="loginStatus" role="alert"></p><div class="actions"><button class="primary" type="submit">验证并登录</button><button class="secondary" type="button" data-close>取消</button></div></form></dialog>
  <dialog id="aboutDialog"><h2>编辑关于我</h2><form id="aboutForm"><label>介绍文字<textarea name="about" maxlength="20000"></textarea></label><label>插入图片（最多 1 MB）<input name="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif"></label><p class="status" id="aboutStatus" role="alert"></p><div class="actions"><button class="primary" type="submit">发布更新</button><button class="secondary" type="button" data-close>取消</button></div></form></dialog>
  <dialog id="postDialog"><h2 id="postDialogTitle">写新内容</h2><form id="postForm"><label>分类<select name="kind"><option>博客</option><option>杂感</option><option>资料</option></select></label><label>标题<input name="title" maxlength="100" required></label><label>正文<textarea name="body" maxlength="120000" required></textarea></label><label>从文本文件导入（可选）<input name="file" type="file" accept=".txt,.md,text/plain,text/markdown"></label><p class="status" id="postStatus" role="alert"></p><div class="actions"><button class="primary" type="submit">发布更新</button><button class="secondary" type="button" data-close>取消</button><button class="secondary" id="deletePost" type="button" hidden>删除此篇</button></div></form></dialog>
  <script>
    'use strict';
    const $=s=>document.querySelector(s), initial={about:'',image:'',posts:[]};
    let data=initial,filter='全部',session=null,editing=null,busy=false;
    const enc=new TextEncoder(),dec=new TextDecoder();
    function b64(s){const bytes=enc.encode(s);let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(binary)}
    function unb64(s){const binary=atob(s.replace(/\s/g,'')),bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));return dec.decode(bytes)}
    async function loadPublic(){try{const r=await fetch('./content.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const value=await r.json();if(!Array.isArray(value.posts))throw Error('内容格式错误');data=value;render()}catch(e){$('#list').textContent='内容暂时无法读取。请确认 content.json 与 index.html 位于同一目录。'}}
    function route(){let page;try{page=decodeURIComponent(location.hash.slice(1))}catch{page='首页'}if(!['首页','资料','博客','杂感','关于我'].includes(page))page='首页';$('#aboutPage').hidden=page!=='关于我';$('#homePage').hidden=page==='关于我';filter=['资料','博客','杂感'].includes(page)?page:'全部';$('#listHeading').textContent=filter==='全部'?'文章与笔记':filter;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+page));render()}
    function render(){const items=(data.posts||[]).filter(x=>filter==='全部'||x.kind===filter);$('#list').replaceChildren();$('#empty').hidden=!!items.length;for(const item of items){const box=document.createElement('details'),summary=document.createElement('summary'),tag=document.createElement('span'),title=document.createElement('h3'),date=document.createElement('span'),body=document.createElement('div');box.className='entry';tag.className='tag';tag.textContent=item.kind;title.textContent=item.title;date.className='date';date.textContent=item.date||'';body.className='body';body.textContent=item.body||'';summary.append(tag,title,date);box.append(summary,body);if(session){const actions=document.createElement('div'),edit=document.createElement('button');actions.className='entry-actions';edit.className='secondary';edit.textContent='编辑或删除';edit.onclick=()=>openPost(item);actions.append(edit);box.append(actions)}$('#list').append(box)}$('#aboutText').textContent=data.about||'';$('#aboutImage').hidden=!data.image;if(data.image)$('#aboutImage').src=data.image;else $('#aboutImage').removeAttribute('src');$('#newArticle').hidden=$('#editAbout').hidden=$('#logout').hidden=!session;$('#loginOpen').hidden=!!session;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter))}
    async function github(path,options={}){const r=await fetch('https://api.github.com'+path,{...options,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+session.token,'X-GitHub-Api-Version':'2022-11-28',...(options.headers||{})}});if(!r.ok){let msg='GitHub 返回 '+r.status;try{const j=await r.json();msg=j.message||msg}catch{}throw Error(msg)}return r.json()}
    function apiPath(){return '/repos/'+encodeURIComponent(session.owner)+'/'+encodeURIComponent(session.repo)+'/contents/'+session.path.split('/').map(encodeURIComponent).join('/')}
    async function commit(next,message){if(busy)return;busy=true;try{const path=apiPath(),current=await github(path+'?ref='+encodeURIComponent(session.branch));const result=await github(path,{method:'PUT',body:JSON.stringify({message,content:b64(JSON.stringify(next,null,2)+'\n'),sha:current.sha,branch:session.branch})});data=next;render();return result}finally{busy=false}}
    $('#loginOpen').onclick=()=>$('#loginDialog').showModal();$('#logout').onclick=()=>{session=null;$('#loginForm').elements.token.value='';render()};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());
    $('#loginForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,status=$('#loginStatus');status.textContent='正在验证…';const button=f.querySelector('[type=submit]');button.disabled=true;try{const u=new URL(f.elements.repo.value.trim());if(u.hostname.toLowerCase()!=='github.com')throw Error('请输入 github.com 的仓库地址');const parts=u.pathname.replace(/\/$/,'').split('/').filter(Boolean);if(parts.length!==2)throw Error('仓库地址应为 github.com/用户名/仓库名');const branch=f.elements.branch.value.trim(),path=f.elements.path.value.trim();if(!branch||!path||path.startsWith('/')||path.split('/').some(x=>!x||x==='..'||x==='.')||!path.endsWith('content.json'))throw Error('请填写仓库内 content.json 的正确路径');session={owner:parts[0],repo:parts[1].replace(/\.git$/,''),branch,path,token:f.elements.token.value.trim()};const user=await github('/user');if(user.login.toLowerCase()!==session.owner.toLowerCase())throw Error('当前令牌所属账号不是该个人仓库的站主');const file=await github(apiPath()+'?ref='+encodeURIComponent(branch));const next=JSON.parse(unb64(file.content));if(!Array.isArray(next.posts))throw Error('仓库中的内容文件格式不正确');data=next;status.textContent='';f.elements.token.value='';$('#loginDialog').close();render()}catch(err){session=null;status.textContent=err.message||'登录失败';render()}finally{button.disabled=false}};
    $('#editAbout').onclick=()=>{$('#aboutForm').elements.about.value=data.about||'';$('#aboutForm').elements.image.value='';$('#aboutStatus').textContent='';$('#aboutDialog').showModal()};
    $('#aboutForm').onsubmit=async e=>{e.preventDefault();if(!session)return;const f=e.currentTarget,status=$('#aboutStatus'),button=f.querySelector('[type=submit]');let image=data.image||'';const file=f.elements.image.files[0];if(file){if(file.size>1000000){status.textContent='图片请压缩到 1 MB 以内';return}image=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('图片读取失败'));reader.readAsDataURL(file)})}button.disabled=true;status.textContent='正在提交到 GitHub…';try{await commit({...data,about:f.elements.about.value,image},'Update about page');$('#aboutDialog').close();alert('已提交到 GitHub。公开网站通常需要稍等片刻才会更新。')}catch(err){status.textContent=err.message||'发布失败'}finally{button.disabled=false}};
    function openPost(item=null){editing=item?.id||null;const f=$('#postForm');f.reset();f.elements.kind.value=item?.kind||'博客';f.elements.title.value=item?.title||'';f.elements.body.value=item?.body||'';$('#postDialogTitle').textContent=item?'编辑内容':'写新内容';$('#deletePost').hidden=!item;$('#postStatus').textContent='';$('#postDialog').showModal()}
    $('#newArticle').onclick=()=>openPost();$('#postForm').elements.file.onchange=async e=>{const file=e.target.files[0];if(file){if(file.size>500000){$('#postStatus').textContent='文本文件请小于 500 KB';return}$('#postForm').elements.body.value=await file.text();if(!$('#postForm').elements.title.value)$('#postForm').elements.title.value=file.name.replace(/\.[^.]+$/,'')}};
    $('#postForm').onsubmit=async e=>{e.preventDefault();if(!session)return;const f=e.currentTarget,status=$('#postStatus'),button=f.querySelector('[type=submit]');button.disabled=true;status.textContent='正在提交到 GitHub…';const post={id:editing||crypto.randomUUID(),kind:f.elements.kind.value,title:f.elements.title.value.trim(),body:f.elements.body.value.trim(),date:new Date().toISOString().slice(0,10)};if(!post.title||!post.body){status.textContent='请填写标题和正文';button.disabled=false;return}const posts=editing?data.posts.map(x=>x.id===editing?post:x):[post,...data.posts];try{await commit({...data,posts},editing?'Update post: '+post.title:'Add post: '+post.title);$('#postDialog').close();alert('已提交到 GitHub。公开网站通常需要稍等片刻才会更新。')}catch(err){status.textContent=err.message||'发布失败'}finally{button.disabled=false}};
    $('#deletePost').onclick=async()=>{if(!session||!editing||!confirm('确定删除这篇内容吗？'))return;const status=$('#postStatus');status.textContent='正在删除…';try{await commit({...data,posts:data.posts.filter(x=>x.id!==editing)},'Delete post');$('#postDialog').close();alert('已提交到 GitHub。')}catch(err){status.textContent=err.message||'删除失败'}};
    document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{location.hash=b.dataset.filter==='全部'?'首页':b.dataset.filter});window.addEventListener('hashchange',route);route();loadPublic();
  </script>
</body>
</html>
