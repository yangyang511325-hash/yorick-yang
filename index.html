<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8f7f1">
  <title>Yorick的个人空间 · yorick-yang</title>
  <style>
    :root{color-scheme:light dark;--bg:#f8f7f1;--fg:#243d30;--muted:#61705e;--line:#b9c5b3;--card:#edf1e8;--accent:#a95135;--btn:#294735}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.75 system-ui,"Microsoft YaHei",sans-serif}
    button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
    header,main,footer{width:min(1100px,90%);margin:auto}header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:16px 0;border-bottom:1px solid var(--line)}.brand{font:bold 27px Georgia,serif;text-decoration:none;margin-right:auto}.brand em{color:var(--accent)}nav{display:flex;gap:16px;flex-wrap:wrap}nav a{text-decoration:none;padding:7px 4px}.active{box-shadow:inset 0 -2px var(--accent)}
    .hero{padding:55px 0 46px;border-bottom:1px solid var(--line)}.eyebrow,.date{font:13px/1.6 ui-monospace,monospace;color:var(--muted);letter-spacing:.08em}h1{font:600 clamp(44px,7vw,78px)/1.15 "Songti SC",SimSun,serif;margin:16px 0}h2{font:600 30px "Songti SC",SimSun,serif}.hero p{max-width:600px;color:var(--muted)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:28px 0 16px}.filters{display:flex;gap:12px;flex-wrap:wrap}.filters button{border:0;background:none;padding:7px 4px}.primary{border:0;border-radius:5px;padding:9px 16px;background:var(--btn);color:#fff}.secondary{border:1px solid var(--line);border-radius:5px;padding:8px 14px;background:transparent}.archive{display:grid;grid-template-columns:190px minmax(0,1fr);gap:32px;border-top:1px solid var(--line);padding-top:20px}.subnav h3{font-size:16px;font-weight:600;margin:0 0 12px}.subnav button{display:flex;justify-content:space-between;gap:12px;width:100%;border:0;border-radius:5px;background:none;text-align:left;padding:8px 10px}.subnav button.active{background:var(--card);box-shadow:none}.subnav button span:last-child{color:var(--muted)}.list{display:grid;gap:12px}.year-heading{font:600 28px "Songti SC",SimSun,serif;margin:8px 0 0}.entry{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:18px}.entry summary{cursor:pointer;list-style:none}.entry summary::-webkit-details-marker{display:none}.entry h3{font:600 23px "Songti SC",SimSun,serif;margin:6px 0}.tag{color:var(--accent)}.entry-meta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.body{white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid var(--line);padding-top:15px;margin-top:15px}.entry-actions{margin-top:14px}
    .subnav h4{font-size:14px;margin:18px 10px 5px;color:var(--muted)}#aboutPage{padding:20px 0 55px}.about-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,300px);gap:28px;align-items:start}.about-text{white-space:pre-wrap;overflow-wrap:anywhere}.about-grid img{width:100%;border-radius:7px;object-fit:cover}.hint,.status{color:var(--muted);font-size:14px}.status[role=alert]{color:var(--accent)}dialog{width:min(620px,94vw);max-height:90vh;overflow:auto;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:24px}dialog::backdrop{background:#17251bb0}dialog label{display:block;margin:12px 0}dialog input,dialog textarea,dialog select{display:block;width:100%;padding:9px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:5px}textarea{min-height:150px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}footer{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-top:1px solid var(--line);padding:20px 0;margin-top:48px;color:var(--muted);font-size:14px}footer button{border:0;background:none;text-decoration:underline;padding:0;font-size:inherit}[hidden]{display:none!important}
    @media(prefers-color-scheme:dark){:root{--bg:#15241b;--fg:#e6ede2;--muted:#b1c1ad;--line:#536756;--card:#22372a;--accent:#e5a582;--btn:#dce9d9}.primary{color:#1b3022}}
    @media(max-width:650px){.about-grid,.archive{grid-template-columns:1fr}header{align-items:flex-start}.hero{padding:35px 0}.subnav{display:flex;gap:6px;flex-wrap:wrap}.subnav h3{width:100%}.subnav button{width:auto}}
  .hero{display:grid;grid-template-columns:140px 1fr;gap:36px;align-items:center}.calendar{display:flex;flex-direction:column;text-align:center;border-right:1px solid var(--line);padding-right:30px;color:var(--muted)}.calendar strong{font:64px/1.3 Georgia,serif;color:var(--fg)}.welcome{display:flex;align-items:center;gap:24px}.welcome h1{font-size:clamp(32px,5vw,60px)}#avatar{width:100px;height:100px;border-radius:50%;object-fit:cover}#avatarOpen{margin-left:16px}@media(max-width:650px){.hero{grid-template-columns:1fr;gap:20px}.calendar{flex-direction:row;gap:12px;align-items:center;border:0;padding:0}.calendar strong{font-size:32px}.welcome{flex-wrap:wrap}} </style>
</head>
<body>
  <header><a class="brand" href="#首页">yorick-yang<em>.</em></a><nav aria-label="主导航"><a href="#首页" id="homeNav">首页</a><a href="#资料" data-nav="资料">资料</a><a href="#博客" data-nav="博客">博客</a><a href="#杂感" data-nav="杂感">杂感</a><a href="#关于我" id="aboutNav">关于我</a></nav></header>
  <main>
    <div id="homePage"><section class="hero"><div class="calendar" aria-label="今天的日期"><span id="todayMonth"></span><strong id="todayDay"></strong><span id="todayWeek"></span></div><div class="welcome"><img id="avatar" alt="Yorick 的头像" hidden><div><div class="eyebrow">YORICK YANG</div><h1>Yorick的个人空间</h1><p id="greeting">欢迎来到我的个人空间。</p><a href="#关于我">关于我</a><button class="secondary" id="avatarOpen" hidden>设置头像</button></div></div></section><section><div class="toolbar"><h2 id="listHeading">文章与笔记</h2><div class="filters" aria-label="大类筛选"><button data-filter="全部">全部</button><button data-filter="资料">资料</button><button data-filter="博客">博客</button><button data-filter="杂感">杂感</button></div><button class="primary" id="newArticle" hidden>写新内容</button></div><div class="archive"><aside class="subnav" aria-label="小分类筛选"><h3>小分类</h3><div id="subcategories"></div></aside><div><div class="list" id="list"></div><p class="hint" id="empty" hidden>这个分类还没有内容。</p></div></div></section></div>
    <section id="aboutPage" hidden><div class="toolbar"><h1>关于我</h1><div class="actions"><button class="primary" id="editAbout" hidden>编辑文字与图片</button><button class="secondary" id="removeAboutImage" hidden>删除当前图片</button></div></div><div class="about-grid"><p class="about-text" id="aboutText"></p><img id="aboutImage" alt="关于我的图片" hidden></div></section>
  </main>
  <footer><span>yorick-yang · 山间手记</span><button id="loginOpen">站主登录</button><button id="logout" hidden>退出站主模式</button></footer>
  <dialog id="loginDialog"><h2>站主登录</h2><p class="hint">使用有该仓库写入权限的 GitHub 精细权限访问令牌。令牌只保存在当前页面内存，关闭或刷新页面即清除。</p><form id="loginForm"><label>GitHub 仓库地址<input name="repo" type="url" placeholder="https://github.com/用户名/仓库名" required></label><label>发布分支<input name="branch" value="main" required></label><label>内容文件在仓库中的路径<input name="path" value="content.json" required></label><label>GitHub 访问令牌<input name="token" type="password" autocomplete="off" required></label><p class="status" id="loginStatus" role="alert"></p><div class="actions"><button class="primary" type="submit">验证并登录</button><button class="secondary" type="button" data-close>取消</button></div></form></dialog>
  <dialog id="aboutDialog"><h2>编辑关于我</h2><form id="aboutForm"><label>介绍文字<textarea name="about" maxlength="20000"></textarea></label><label>插入或替换图片（自动压缩，原图最多 30 MB）<input name="image" type="file" accept="image/png,image/jpeg,image/webp"></label><label id="removeImageLabel"><input name="removeImage" type="checkbox" style="display:inline;width:auto;margin-right:8px">删除当前图片</label><p class="status" id="aboutStatus" role="alert"></p><div class="actions"><button class="primary" type="submit">发布更新</button><button class="secondary" type="button" data-close>取消</button></div></form></dialog>
  <dialog id="postDialog"><h2 id="postDialogTitle">写新内容</h2><form id="postForm"><label>大类<select name="kind"><option>博客</option><option>杂感</option><option>资料</option></select></label><label>小分类<input name="subcategory" maxlength="30" placeholder="例如：学习、旅行、读书"></label><label>发布日期与时间<input name="publishedAt" type="datetime-local"></label><label>标题<input name="title" maxlength="100" required></label><label>正文<textarea name="body" maxlength="120000" required></textarea></label><label>从文本文件导入（可选）<input name="file" type="file" accept=".txt,.md,text/plain,text/markdown"></label><p class="status" id="postStatus" role="alert"></p><div class="actions"><button class="primary" type="submit">发布更新</button><button class="secondary" type="button" data-close>取消</button><button class="secondary" id="deletePost" type="button" hidden>删除此篇</button></div></form></dialog>
  <dialog id="avatarDialog"><h2>设置头像</h2><form id="avatarForm"><label>选择头像（自动压缩，原图最多 30 MB）<input name="avatarFile" type="file" accept="image/png,image/jpeg,image/webp"></label><label><input name="remove" type="checkbox" style="width:auto;display:inline"> 删除当前头像</label><p id="avatarStatus" role="status"></p><div class="actions"><button class="primary">保存并发布</button><button class="secondary" type="button" data-close>取消</button></div></form></dialog><script>
    'use strict';
    const $=s=>document.querySelector(s), initial={about:'',image:'',posts:[]}, kinds=['资料','博客','杂感'], presets={资料:['课程笔记','学习资料','参考链接'],博客:['学习','读书','生活','网站'],杂感:['日常','随想','灵感']};
    let data=initial,filter='全部',subfilter='全部',session=null,editing=null,busy=false;
    const enc=new TextEncoder(),dec=new TextDecoder();
    async function compressImage(file,maxSide=1600,targetBytes=450000){
      if(file.size>30*1024*1024)throw Error('原图超过 30 MB，请先选择较小的图片');
      const url=URL.createObjectURL(file),img=new Image();
      try{
        await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('无法读取这张图片。请使用 JPG、PNG 或 WebP 格式；HEIC 请先转为 JPG。'));img.src=url});
        const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
        if(!ctx)throw Error('浏览器无法处理图片，请更换浏览器重试');
        const scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
        let width=Math.max(1,Math.round(img.naturalWidth*scale)),height=Math.max(1,Math.round(img.naturalHeight*scale)),blob;
        for(let round=0;round<6;round++){
          canvas.width=width;canvas.height=height;ctx.clearRect(0,0,width,height);ctx.drawImage(img,0,0,width,height);
          for(const quality of [.86,.72,.58]){
            blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',quality));
            if(!blob)throw Error('图片压缩失败，请换一张图片重试');
            if(blob.size<=targetBytes)break;
          }
          if(blob.size<=targetBytes)break;
          width=Math.max(1,Math.round(width*.75));height=Math.max(1,Math.round(height*.75));
        }
        if(blob.size>targetBytes)throw Error('图片仍然过大，请选择尺寸较小的图片');
        return await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('图片读取失败'));reader.readAsDataURL(blob)});
      }finally{URL.revokeObjectURL(url)}
    }
    function b64(s){const bytes=enc.encode(s);let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(binary)}
    function unb64(s){const binary=atob(s.replace(/\s/g,'')),bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));return dec.decode(bytes)}
    async function loadPublic(){try{const r=await fetch('./content.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const value=await r.json();if(!Array.isArray(value.posts))throw Error('内容格式错误');data=value;render()}catch(e){$('#list').textContent='内容暂时无法读取。请确认 content.json 与 index.html 位于同一目录。'}}
    function localMinute(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
    function dateLabel(item){const value=item.publishedAt||item.date||'';return value?value.slice(0,10).replace(/-/g,'.')+(value.includes('T')?' '+value.slice(11,16):''):'日期未记录'}
    function category(item){return (item.subcategory||'').trim()||'未分类'}
    function route(){let parts;try{parts=decodeURIComponent(location.hash.slice(1)).split('/')}catch{parts=['首页']}let page=parts[0];if(!['首页',...kinds,'关于我'].includes(page))page='首页';$('#aboutPage').hidden=page!=='关于我';$('#homePage').hidden=page==='关于我';filter=kinds.includes(page)?page:'全部';subfilter=filter==='全部'?'全部':parts[1]||'全部';$('#listHeading').textContent=filter==='全部'?'文章与笔记':filter;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+page));render()}
    function renderSubcategories(major){const nav=$('#subcategories');nav.replaceChildren();function add(name,count,kind){const button=document.createElement('button'),label=document.createElement('span'),number=document.createElement('span');button.type='button';button.classList.toggle('active',filter===kind&&subfilter===name);label.textContent=name;number.textContent=count;button.append(label,number);button.onclick=()=>{location.hash=name==='全部'?(kind==='全部'?'首页':kind):kind+'/'+name};nav.append(button)}add('全部',major.length,filter);for(const kind of filter==='全部'?kinds:[filter]){if(filter==='全部'){const heading=document.createElement('h4');heading.textContent=kind;nav.append(heading)}const posts=(data.posts||[]).filter(x=>x.kind===kind),counts=new Map();for(const item of posts){const name=category(item);counts.set(name,(counts.get(name)||0)+1)}const names=[...new Set([...presets[kind],...counts.keys()])];for(const name of names)add(name,counts.get(name)||0,kind)}}
    function render(){$('#avatar').hidden=!data.avatar;if(data.avatar)$('#avatar').src=data.avatar;else $('#avatar').removeAttribute('src');$('#avatarOpen').hidden=!session;const major=(data.posts||[]).filter(x=>filter==='全部'||x.kind===filter);renderSubcategories(major);const items=major.filter(x=>subfilter==='全部'||category(x)===subfilter).sort((a,b)=>(b.publishedAt||b.date||'').localeCompare(a.publishedAt||a.date||''));$('#list').replaceChildren();$('#empty').hidden=!!items.length;let lastYear='';for(const item of items){const year=(item.publishedAt||item.date||'').slice(0,4)||'日期未记录';if(year!==lastYear){const heading=document.createElement('h3');heading.className='year-heading';heading.textContent=year;$('#list').append(heading);lastYear=year}const box=document.createElement('details'),summary=document.createElement('summary'),tag=document.createElement('span'),title=document.createElement('h3'),meta=document.createElement('div'),date=document.createElement('span'),sub=document.createElement('span'),body=document.createElement('div');box.className='entry';tag.className='tag';tag.textContent=item.kind;title.textContent=item.title;meta.className='entry-meta';date.className='date';date.textContent=dateLabel(item);sub.className='date';sub.textContent=category(item);meta.append(date,sub);body.className='body';body.textContent=item.body||'';summary.append(tag,title,meta);box.append(summary,body);if(session){const actions=document.createElement('div'),edit=document.createElement('button');actions.className='entry-actions';edit.className='secondary';edit.textContent='编辑或删除';edit.onclick=()=>openPost(item);actions.append(edit);box.append(actions)}$('#list').append(box)}$('#aboutText').textContent=data.about||'';$('#aboutImage').hidden=!data.image;if(data.image)$('#aboutImage').src=data.image;else $('#aboutImage').removeAttribute('src');$('#newArticle').hidden=$('#editAbout').hidden=$('#logout').hidden=!session;$('#removeAboutImage').hidden=!session||!data.image;$('#loginOpen').hidden=!!session;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter))}
    async function github(path,options={}){const r=await fetch('https://api.github.com'+path,{cache:'no-store',...options,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+session.token,'X-GitHub-Api-Version':'2022-11-28',...(options.headers||{})}});if(!r.ok){let msg='GitHub 返回 '+r.status;try{const j=await r.json();msg=j.message||msg}catch{}const error=Error(msg);error.status=r.status;throw error}return r.json()}
    function apiPath(){return '/repos/'+encodeURIComponent(session.owner)+'/'+encodeURIComponent(session.repo)+'/contents/'+session.path.split('/').map(encodeURIComponent).join('/')}
    async function readContent(file){const blob=file.content?file:await github('/repos/'+encodeURIComponent(session.owner)+'/'+encodeURIComponent(session.repo)+'/git/blobs/'+encodeURIComponent(file.sha));return JSON.parse(unb64(blob.content))}
    async function commit(change,message){if(busy)throw Error('另一项发布仍在进行，请稍后再试');busy=true;try{const path=apiPath();for(let attempt=0;attempt<4;attempt++){const current=await github(path+'?ref='+encodeURIComponent(session.branch)+'&v='+Date.now()+'-'+attempt);const latest=await readContent(current);if(!Array.isArray(latest.posts))throw Error('仓库中的 content.json 格式不正确');const next=change(latest);if(!next){data=latest;render();return}try{const result=await github(path,{method:'PUT',body:JSON.stringify({message,content:b64(JSON.stringify(next,null,2)+'\n'),sha:current.sha,branch:session.branch})});data=next;render();return result}catch(err){if(attempt===3||!(err.status===409||err.status===422&&/sha|does not match/i.test(err.message)))throw err;await new Promise(resolve=>setTimeout(resolve,300*(attempt+1)))}}}finally{busy=false}}
    $('#loginOpen').onclick=()=>$('#loginDialog').showModal();$('#logout').onclick=()=>{session=null;$('#loginForm').elements.token.value='';render()};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());
    $('#loginForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,status=$('#loginStatus');status.textContent='正在验证…';const button=f.querySelector('[type=submit]');button.disabled=true;try{const u=new URL(f.elements.repo.value.trim());if(u.hostname.toLowerCase()!=='github.com')throw Error('请输入 github.com 的仓库地址');const parts=u.pathname.replace(/\/$/,'').split('/').filter(Boolean);if(parts.length!==2)throw Error('仓库地址应为 github.com/用户名/仓库名');const branch=f.elements.branch.value.trim(),path=f.elements.path.value.trim();if(!branch||!path||path.startsWith('/')||path.split('/').some(x=>!x||x==='..'||x==='.')||!path.endsWith('content.json'))throw Error('请填写仓库内 content.json 的正确路径');session={owner:parts[0],repo:parts[1].replace(/\.git$/,''),branch,path,token:f.elements.token.value.trim()};const user=await github('/user');if(user.login.toLowerCase()!==session.owner.toLowerCase())throw Error('当前令牌所属账号不是该个人仓库的站主');const file=await github(apiPath()+'?ref='+encodeURIComponent(branch));const next=await readContent(file);if(!Array.isArray(next.posts))throw Error('仓库中的内容文件格式不正确');data=next;status.textContent='';f.elements.token.value='';$('#loginDialog').close();render()}catch(err){session=null;status.textContent=err.message||'登录失败';render()}finally{button.disabled=false}};
    $('#editAbout').onclick=()=>{const f=$('#aboutForm');f.elements.about.value=data.about||'';f.elements.image.value='';f.elements.removeImage.checked=false;$('#removeImageLabel').hidden=!data.image;$('#aboutStatus').textContent='';$('#aboutDialog').showModal()};
    $('#removeAboutImage').onclick=async()=>{if(!session||!data.image||!confirm('确定删除“关于我”的当前图片吗？'))return;const button=$('#removeAboutImage');button.disabled=true;button.textContent='正在删除…';try{await commit(latest=>({...latest,image:''}),'Remove about image');alert('图片已从内容文件删除。公开网站更新可能需要稍等片刻。')}catch(err){alert('删除失败：'+(err.message||'请稍后重试'))}finally{button.disabled=false;button.textContent='删除当前图片'}};
    $('#aboutForm').onsubmit=async e=>{e.preventDefault();if(!session)return;const f=e.currentTarget,status=$('#aboutStatus'),button=f.querySelector('[type=submit]'),remove=f.elements.removeImage.checked,file=f.elements.image.files[0];if(file&&remove){status.textContent='请只选择新图片或删除当前图片';return}button.disabled=true;try{let image=null;if(file){status.textContent='正在自动压缩图片…';image=await compressImage(file)}status.textContent='正在提交到 GitHub…';const about=f.elements.about.value;await commit(latest=>({...latest,about,image:remove?'':image??latest.image??''}),'Update about page');$('#aboutDialog').close();alert('已提交到 GitHub。公开网站通常需要稍等片刻才会更新。')}catch(err){status.textContent=err.message||'发布失败'}finally{button.disabled=false}};
    function openPost(item=null){editing=item?.id||null;const f=$('#postForm');f.reset();f.elements.kind.value=item?.kind||(filter==='全部'?'博客':filter);f.elements.subcategory.value=item?.subcategory||'';f.elements.publishedAt.value=item?.publishedAt||(!item?localMinute():'');f.elements.title.value=item?.title||'';f.elements.body.value=item?.body||'';$('#postDialogTitle').textContent=item?'编辑内容':'写新内容';$('#deletePost').hidden=!item;$('#postStatus').textContent='';$('#postDialog').showModal()}
    $('#newArticle').onclick=()=>openPost();$('#postForm').elements.file.onchange=async e=>{const file=e.target.files[0];if(file){if(file.size>500000){$('#postStatus').textContent='文本文件请小于 500 KB';return}$('#postForm').elements.body.value=await file.text();if(!$('#postForm').elements.title.value)$('#postForm').elements.title.value=file.name.replace(/\.[^.]+$/,'')}};
    $('#postForm').onsubmit=async e=>{e.preventDefault();if(!session)return;const f=e.currentTarget,status=$('#postStatus'),button=f.querySelector('[type=submit]');button.disabled=true;status.textContent='正在提交到 GitHub…';const previous=editing?data.posts.find(x=>x.id===editing):null,publishedAt=f.elements.publishedAt.value||previous?.publishedAt||(!editing?localMinute():''),post={id:editing||crypto.randomUUID(),kind:f.elements.kind.value,subcategory:f.elements.subcategory.value.trim(),title:f.elements.title.value.trim(),body:f.elements.body.value.trim(),publishedAt,date:publishedAt?publishedAt.slice(0,10):previous?.date||''};if(!post.title||!post.body){status.textContent='请填写标题和正文';button.disabled=false;return}try{await commit(latest=>{if(editing&&!latest.posts.some(x=>x.id===editing))throw Error('这篇内容已被删除，请刷新页面');const posts=editing?latest.posts.map(x=>x.id===editing?post:x):[post,...latest.posts];return {...latest,posts}},editing?'Update post: '+post.title:'Add post: '+post.title);$('#postDialog').close();alert('已提交到 GitHub。公开网站通常需要稍等片刻才会更新。')}catch(err){status.textContent=err.message||'发布失败'}finally{button.disabled=false}};
    $('#deletePost').onclick=async()=>{if(!session||!editing||!confirm('确定删除这篇内容吗？'))return;const status=$('#postStatus'),id=editing;status.textContent='正在删除…';try{await commit(latest=>latest.posts.some(x=>x.id===id)?{...latest,posts:latest.posts.filter(x=>x.id!==id)}:null,'Delete post');$('#postDialog').close();alert('已删除；公开网站通常需要稍等片刻才会更新。')}catch(err){status.textContent=err.message||'删除失败'}};
    function updateToday(){const now=new Date();$('#todayMonth').textContent=now.getFullYear()+'年'+(now.getMonth()+1)+'月';$('#todayDay').textContent=now.getDate();$('#todayWeek').textContent=new Intl.DateTimeFormat('zh-CN',{weekday:'long'}).format(now);const hour=now.getHours();$('#greeting').textContent=(hour<6?'夜深了':hour<12?'上午好':hour<18?'下午好':'晚上好')+'，欢迎来到我的个人空间。愿你在这里读到一些有意思的记录。'}updateToday();setInterval(updateToday,30000);document.addEventListener('visibilitychange',updateToday);
    $('#avatarOpen').onclick=()=>{$('#avatarForm').reset();$('#avatarStatus').textContent='';$('#avatarDialog').showModal()};$('#avatarForm').onsubmit=async e=>{e.preventDefault();if(!session)return;const f=e.currentTarget,file=f.elements.avatarFile.files[0],remove=f.elements.remove.checked,status=$('#avatarStatus');if(file&&remove){status.textContent='请选择上传或删除其中一项';return}if(!file&&!remove){status.textContent='请选择头像';return}const button=f.querySelector('button');button.disabled=true;try{status.textContent='正在自动压缩头像…';const avatar=remove?'':await compressImage(file,512,150000);status.textContent='正在发布…';await commit(latest=>({...latest,avatar}),'Update avatar');$('#avatarDialog').close();alert('头像已提交，等待网站部署更新。')}catch(err){status.textContent=err.message}finally{button.disabled=false}};
    document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{location.hash=b.dataset.filter==='全部'?'首页':b.dataset.filter});window.addEventListener('hashchange',route);route();loadPublic();
  </script>
</body>
